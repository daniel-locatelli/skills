<title id='abm-title'>Agent-based hexagonal plates — plan</title>
<desc id='abm-desc'>150 agents relaxed on z = h cos(wx) cos(wy); plates by tangent-plane intersection; convex plates muted, concave (bow-tie) plates in accent.</desc>
